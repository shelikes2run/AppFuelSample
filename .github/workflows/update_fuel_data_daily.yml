name: update-fuel-data

on:
  # Automatically run every day at 09:00 UTC
  schedule:
    - cron: "0 9 * * *"
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      # Checkout your repository code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Python 3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Install dependencies (none required, pandas included by default)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      # Run the data fetching script
      - name: Run fetch_fuel_samples.py
        run: python fetch_fuel_samples.py

      # Commit and push updated CSV files
      - name: Commit updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add field_samples_2005_2014.csv field_samples_2015_present.csv
          git commit -m "🔄 Update fuel samples CSVs [auto]" || echo "No changes to commit"
          git push
