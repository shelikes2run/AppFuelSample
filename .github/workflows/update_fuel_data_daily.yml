name: update-fuel-data

on:
  schedule:
    - cron: '0 12 * * *'  # Runs every day at 12:00 UTC
  workflow_dispatch:      # Allows manual trigger

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: 🚀 Run fetch script
        run: python fetch_fuel_samples.py

      - name: 📤 Commit and Push CSV (if changed)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add field_samples_2015_present.csv

          # Check for changes before committing
          if git diff --cached --quiet; then
            echo "✅ No changes detected in field_samples_2015_present.csv."
          else
            git commit -m "🔄 Update fuel sample data (automated)"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
