name: Update Fuel Sample Data

on:
  schedule:
    - cron: '0 12 * * *'  # Runs daily at 12:00 UTC
  workflow_dispatch:      # Manual trigger option

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # ✅ Fixed version

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run script to fetch fuel samples
        run: python fetch_fuel_samples.py

      - name: Commit and push updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add field_samples_*.csv
          git commit -m "🔄 Auto-update fuel sample CSVs [skip ci]" || echo "No changes to commit"
          git push
