name: Update Fuel Samples Daily

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3:00 AM UTC
  workflow_dispatch:     # Allows manual run from GitHub interface

jobs:
  update-fuel-data:
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout Repository
      uses: actions/checkout@v3

    - name: 🐍 Set Up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Install Dependencies
      run: pip install pandas

    - name: 🚀 Run Fetch Script
      run: python fetch_fuel_samples.py

    - name: 💾 Commit and Push Updated CSVs
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add field_samples_*.csv
        git commit -m "🔄 Auto-update fuel sample CSVs [$(date +'%Y-%m-%d')]"
        git push
