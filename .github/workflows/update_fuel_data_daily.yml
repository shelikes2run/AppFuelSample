name: Update Fuel Sample Data Daily

on:
  schedule:
    - cron: '0 12 * * *'  # Every day at 12:00 UTC
  workflow_dispatch:      # Manual trigger option

jobs:
  update-fuel-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pandas requests

      - name: Run Python script to fetch 2015–present data
        run: python fetch_fuel_samples.py

      - name: Commit and push updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add field_samples_2015_present.csv
          git commit -m "🔄 Auto-update: fuel sample data (2015–present) - $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
