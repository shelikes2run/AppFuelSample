name: Update FUEL Model Samples Daily

on:
  schedule:
    - cron: '0 6 * * *'  # Runs every day at 6 AM UTC
  workflow_dispatch:     # Allow manual trigger from GitHub UI

jobs:
  update-fuel-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: 🚀 Run Fetch Script
        run: |
          echo "🔧 Running Python script with logging..."
          python fetch_fuel_samples.py

      - name: 💾 Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add field_samples_*.csv
          git commit -m "🔄 Auto-update FUEL model samples CSVs [skip ci]" || echo "No changes to commit"
          git push
