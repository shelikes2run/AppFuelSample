name: Update FUEL Model Samples Daily

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily
  workflow_dispatch:

jobs:
  update-fuel-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: 🚀 Run Python fetch script
        run: |
          echo "📄 Running fetch_fuel_samples.py..."
          python fetch_fuel_samples.py || { echo "❌ Script failed"; exit 1; }

      - name: 💾 Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add field_samples_*.csv || echo "⚠️ No files found to add"
          git commit -m "🔄 Auto-update FUEL model samples CSVs [skip ci]" || echo "⚠️ Nothing to commit"
          git push || echo "⚠️ Nothing to push"
