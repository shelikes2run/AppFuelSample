name: Update Fuel Samples Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Runs every day at 6:00 AM UTC

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Data Fetch Script
        run: |
          echo "🔍 Fetching fuel model data..."
          python fetch_fuel_samples.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add field_samples_*.csv
          git commit -m "📦 Auto-update fuel sample CSVs [skip ci]" || echo "No changes to commit"
          git push
