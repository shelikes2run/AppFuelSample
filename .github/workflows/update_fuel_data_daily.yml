import pandas as pd
from datetime import datetime

# Define time range (start date fixed, end date is today)
start_date = "2015-01-01T00:00:00.000Z"
end_date = datetime.utcnow().strftime("%Y-%m-%dT23:00:00.000Z")

# API Endpoint and parameters
URL = "https://fems.fs2c.usda.gov/fuelmodel/sample/download"
PARAMS = {
    "returnAll": "",
    "responseFormat": "csv",
    "siteId": "All",
    "sampleId": "",
    "startDate": start_date,
    "endDate": end_date,
    "filterByFuelId": "",
    "filterByStatus": "Submitted",
    "filterByCategory": "All",
    "filterBySubCategory": "All",
    "filterByMethod": "All",
    "sortBy": "fuel_type",
    "sortOrder": "asc"
}

# Build the query string and fetch the data
query_string = "&".join([f"{key}={value}" for key, value in PARAMS.items()])
full_url = f"{URL}?{query_string}"

try:
    df = pd.read_csv(full_url)
    df.columns = [
        "Sample Id", "Date-Time", "Site Name", "SiteId", "Fuel Type",
        "Category", "Sub-Category", "Method", "Sample Avg Value", "Sample Status"
    ]

    # Parse and clean datetime
    df["Date-Time"] = pd.to_datetime(df["Date-Time"], errors="coerce")
    df = df[df["Date-Time"].notnull()]

    # Save only the 2015+ records
    today_str = datetime.today().strftime("%Y%m%d")
    df.to_csv(f"field_samples_2015_present_{today_str}.csv", index=False)

    print(f"✅ Saved: field_samples_2015_present_{today_str}.csv")

except Exception as e:
    print("❌ Error:", e)
